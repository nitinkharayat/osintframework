<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">OSINT framework graph</title><desc id="desc">A linked evidence graph gathers separate source cards around a shared case node.</desc>
<style>
.link{fill:none;stroke:#b7aa70;stroke-width:2;stroke-dasharray:4 4}.node{fill:#fffdf1;stroke:#88753d;stroke-width:2}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 9s linear infinite}.pulse{animation:pulse 2.7s ease-in-out infinite}.p2{animation-delay:.7s}.p3{animation-delay:1.3s}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}
</style>
<path class="link" d="M180 116 82 68M180 116 275 63M180 116 89 174M180 116 274 175M82 68 275 63M89 174 274 175"/>
<g class="node"><rect x="34" y="42" width="90" height="53" rx="4"/><path d="M46 56h54M46 67h39M46 78h46" fill="none" stroke="#c6b777" stroke-width="2.5" stroke-linecap="round"/><rect x="232" y="37" width="92" height="53" rx="4"/><path d="M245 51h56M245 62h45M245 73h38" fill="none" stroke="#c6b777" stroke-width="2.5" stroke-linecap="round"/><rect x="40" y="149" width="96" height="53" rx="4"/><path d="M53 163h57M53 174h41M53 185h50" fill="none" stroke="#c6b777" stroke-width="2.5" stroke-linecap="round"/><rect x="226" y="149" width="98" height="53" rx="4"/><path d="M239 163h58M239 174h47M239 185h35" fill="none" stroke="#c6b777" stroke-width="2.5" stroke-linecap="round"/></g>
<g><circle class="node pulse" cx="180" cy="116" r="34" fill="#eee5bd"/><circle cx="180" cy="116" r="21" fill="none" stroke="#88753d" stroke-width="1.5"/><path d="M180 95v42M159 116h42" stroke="#88753d" stroke-width="1.5"/><circle cx="180" cy="116" r="5" fill="#88753d"/></g>
<g class="orbit"><circle cx="180" cy="116" r="63" fill="none" stroke="#d6c987" stroke-width="1.3" stroke-dasharray="3 6"/><circle cx="180" cy="53" r="4" fill="#88753d"/><circle cx="243" cy="116" r="4" fill="#88753d"/></g>
<g class="pulse p2" fill="#88753d"><circle cx="82" cy="68" r="4"/><circle cx="275" cy="63" r="4"/><circle cx="89" cy="174" r="4"/><circle cx="274" cy="175" r="4"/></g><g font-family="monospace" font-size="9" fill="#82713d" letter-spacing="1"><text x="36" y="23">CORRELATE SOURCES</text><text x="226" y="221">PROVENANCE / LINKS</text></g>
</svg>