<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">Utilities terminal and tool gear</title><desc id="desc">A quiet workstation illustration with a blinking terminal cursor and a slowly turning utility gear.</desc>
<style>
.ink{stroke:#505951;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.gear{transform-box:fill-box;transform-origin:center;animation:gear-turn 8s linear infinite}.cursor{animation:blink 1s steps(2,start) infinite}.status{animation:status 2.4s ease-in-out infinite}@keyframes gear-turn{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes status{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.gear,.cursor,.status{animation:none}}
</style>
