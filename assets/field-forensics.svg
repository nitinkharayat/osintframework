<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">Forensics evidence file</title><desc id="desc">An evidence folder, fingerprint, and moving magnifier symbolise careful examination.</desc>
<style>
.ink{stroke:#6b4b30;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.fp{fill:none;stroke:#bd946c;stroke-width:2;stroke-linecap:round;animation:fp 3s ease-in-out infinite}.lens{animation:lens-sweep 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tag{animation:tag 2.3s ease-in-out infinite}@keyframes fp{0%,100%{opacity:.35}50%{opacity:1}}@keyframes lens-sweep{0%,100%{transform:translate(-7px,2px)}50%{transform:translate(11px,-9px)}}@keyframes tag{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.fp,.lens,.tag{animation:none}}
</style>
