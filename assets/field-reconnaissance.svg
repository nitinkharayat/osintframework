<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc">
<title id="title">Reconnaissance camera scanning</title><desc id="desc">An editorial line illustration of a field camera, with an animated lens scan and aperture.</desc>
<style>
  .ink{stroke:#394b3b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.soft{stroke:#9aaa91;stroke-width:1.4;fill:none}.accent{stroke:#53694a}.scan{transform-box:view-box;transform-origin:179px 127px;animation:scan-rotate 3.8s linear infinite}.focus{animation:focus-pulse 2.8s ease-in-out infinite}.glint{animation:glint 2.8s ease-in-out infinite}@keyframes scan-rotate{to{transform:rotate(360deg)}}@keyframes focus-pulse{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.95;transform:scale(1.04)}}@keyframes glint{0%,100%{opacity:.2}45%{opacity:1}}@media(prefers-reduced-motion:reduce){.scan,.focus,.glint{animation:none}}
</style>
